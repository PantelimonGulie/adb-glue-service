<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Sign in | Glue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="signin">
<main class="signin-card">
  <span class="brand">
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="6" r="3"/><circle cx="5" cy="18" r="3"/><circle cx="19" cy="12" r="3"/><path d="M8 6h3a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H8M14 12h2"/></svg>
    <span>Glue</span>
  </span>
  <h1>Sign in</h1>
  <p class="muted">Orders and stock for Electronic Market.</p>
  {% if error %}<p class="rcard-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/sign-in">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="username">User name</label>
    <input id="username" name="username" autocomplete="username" maxlength="32" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
    <button type="submit" class="btn-primary">Sign in</button>
  </form>
  <p class="signin-hint">Demo users: <strong>viewer</strong>, <strong>operator</strong> and <strong>admin</strong>. The default password is the user name; set <code>VIEWER_PASSWORD</code>, <code>OPERATOR_PASSWORD</code> and <code>ADMIN_PASSWORD</code> in <code>.env</code> to change them.</p>
</main>
</body>
</html>
