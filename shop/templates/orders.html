<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>My orders - Electronic Market</title></head>
<body>
<h1>My orders</h1>
<p><a href="/">Back to catalog</a></p>
<table border="1" cellpadding="4">
  <tr><th>Order</th><th>Items</th><th>Customer</th><th>Status</th><th></th></tr>
  {% for order in orders %}
  <tr>
    <td>{{ order.id }}</td>
    <td>{% for line in order.lines %}{{ line.qty }} x {{ line.sku }} {% endfor %}</td>
    <td>{{ order.customer }}</td>
    <td>{{ order.status }}</td>
    <td>
      {% if order.status == "pending" %}
      <form method="post" action="/orders/{{ order.id }}/cancel"><button>Cancel</button></form>
      {% endif %}
    </td>
  </tr>
  {% else %}
  <tr><td colspan="5">No orders yet.</td></tr>
  {% endfor %}
</table>
</body>
</html>
