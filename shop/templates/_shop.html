{% extends "mock_base.html" %}
{% block fonts %}<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">{% endblock %}
{% block skin %}skin-shop{% endblock %}
{% block body %}
<header class="shop-header">
  <div class="shop-bar">
    <a class="shop-logo" href="/">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7"/><path d="M18 5 9 18h6l-2 9 9-13h-6z"/></svg>
      Electronic Market
    </a>
    <nav class="shop-nav" aria-label="Shop">
      <a href="/"{% if page == "catalog" %} aria-current="page"{% endif %}>Catalog</a>
      <a href="/orders"{% if page == "orders" %} aria-current="page"{% endif %}>My orders</a>
    </nav>
  </div>
  <p class="shop-promise">Free delivery across Romania on orders over 250 RON. Shipped from our Bucharest warehouse.</p>
</header>
<main class="shop-main">
{% block content %}{% endblock %}
</main>
{% endblock %}
