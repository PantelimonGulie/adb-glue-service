x-app: &app
  build: .
  image: adb-glue-service
  env_file:
    - path: .env
      required: false

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 5

services:
  shop:
    <<: *app
    command: uvicorn shop.main:app --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]
    environment:
      GLUE_URL: http://glue:8000
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]

  emag:
    <<: *app
    command: uvicorn emag.main:app --host 0.0.0.0 --port 8002
    ports: ["8002:8002"]
    environment:
      GLUE_URL: http://glue:8000
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]

  warehouse:
    <<: *app
    command: uvicorn warehouse.main:app --host 0.0.0.0 --port 8003
    ports: ["8003:8003"]
    environment:
      GLUE_URL: http://glue:8000
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]

  glue:
    <<: *app
    command: uvicorn glue.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      SHOP_URL: http://shop:8001
      EMAG_URL: http://emag:8002
      WAREHOUSE_URL: http://warehouse:8003
      DB_PATH: /data/glue.db
      HTTP_TIMEOUT_SECONDS: "2"
      RETRY_ATTEMPTS: "5"
      RETRY_BASE_SECONDS: "0.5"
      WORKER_CONCURRENCY: "10"
      RECONCILE_INTERVAL_SECONDS: "10"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    volumes:
      - glue-data:/data
    depends_on:
      shop: {condition: service_healthy}
      emag: {condition: service_healthy}
      warehouse: {condition: service_healthy}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]

volumes:
  glue-data:
